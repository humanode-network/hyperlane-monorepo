image:
  repository: ghcr.io/humanode-network/hyperlane-agent
  pullPolicy: IfNotPresent
  tag: 'latest'

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''

# -- External Secret Store type and name
externalSecrets:
  # Whether the chart renders ExternalSecrets for the External Secrets Operator
  # to fill. With false, the Secrets named under `secrets` exist already.
  enabled: true
  # Available types: SecretStore, ClusterSecretStore
  storeType: ClusterSecretStore
  storeName:
  # Prepended to every remoteRef.key. GCP Secret Manager takes bare names;
  # ESO's Scaleway provider wants "name:" (or "id:" / "path:") in front.
  keyPrefix: ''

# Names of pre-existing Secrets the pods mount, for clusters without the
# External Secrets Operator. Empty means the chart's own ExternalSecret output.
secrets:
  # HYP_CHAINS_<CHAIN>_CUSTOMRPCURLS per chain.
  rpcEndpoints: ''
  # validator-<i>.env per replica: HYP_VALIDATOR_KEY, HYP_CHAINS_<CHAIN>_SIGNER_KEY.
  validatorKeys: ''
  # validator-<i>.env per replica: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
  # Kept apart from the signing keys; mounted only when set.
  validatorS3: ''
  # HYP_CHAINS_<CHAIN>_SIGNER_KEY and _SIGNER_TYPE per chain.
  relayerKeys: ''

podAnnotations: {}
podCommonLabels: {}

storage:
  storageClass: 'standard'
  accessModes: ReadWriteOnce

# -- Hyperlane Overrides
# By Default, Hyperlane Agents load the config baked into the Docker Image
# Pass values here in order to override the values in the config
# Note: For successful operation, one _must_ pass signer keys as
#       they are not baked into the image for security reasons.
hyperlane:
  # Defines what environment is being run
  runEnv: 'default'
  context: 'hyperlane'
  # Set the DB location to be the volume
  dbPath: /usr/share/hyperlane
  rustBacktrace: full
  tracing:
    # Set the log formatting
    format: json
    # Set the log level
    level: debug
  metrics:
    port: 9090
  aws: # true | false
  # Extra environment for every agent, rendered into the shared ConfigMap.
  # For example AWS_ENDPOINT_URL for an S3-compatible checkpoint store.
  extraEnv: {}

  # -- Chain overrides, a sequence
  # This should mirror @humanode-hyperlane/sdk AgentChainMetadata
  chains:
    - name: examplechain
      rpcConsensusType: fallback
      signer:
        type: # aws
      index:
        from:
        chunk:
        mode:
      mailbox:
      multisigIsm:
      interchainGasPaymaster:
      interchainSecurityModule:
      protocol: ethereum
      chainId:
      domainId:
      customRpcUrls:
        - example:
            url: https://example.com
            priority: 1
      blocks:
        confirmations:
        reorgPeriod:
        estimatedBlockTime:
      isTestnet: false

  # Hyperlane Agent Roles
  # Individually Switchable via <role>.enabled
  validator:
    enabled: false
    podAnnotations:
      prometheus.io/port: '9090'
      prometheus.io/scrape: 'true'
    podLabels: {}
    storage:
      size: 10Gi
      snapshot:
        enabled: false
        name: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    # -- How long to wait between checking for updates
    configs: []
      # - interval:
      #   checkpointSyncers:
      #   originChainName:
      #   type: # "hexKey"

  relayer:
    # Optional Secret Manager name for diagnostics PostgreSQL; never put the URL here.
    messageActivityDatabaseUrlSecret: ''
    enabled: false
    aws: # true | false
    # relayApi controls only the containerPort declaration so Kubernetes knows
    # about the port. The actual HYP_RELAYAPIENABLED / HYP_RELAYAPIPORT env vars
    # flow through envConfig (set by the infra TS helpers). Direct Helm users
    # must also populate envConfig with relay API fields to enable the feature.
    relayApi:
      enabled: false
      port: 8900
      tunnel:
        image: cloudflare/cloudflared:2026.8.2
    podAnnotations:
      prometheus.io/port: '9090'
      prometheus.io/scrape: 'true'
    podLabels: {}
    storage:
      name: 'state-premium'
      storageClass: 'premium-immediate-rwo'
      size: 32Gi
      snapshot:
        enabled: false
        name: ''
    resources:
      requests:
        cpu: 1000m
        memory: 1024Mi
    envConfig:
      relayChains: ''
    configMapConfig: {}
    # -- Specify whether a default signer key is used for all chains in Values.hyperlane.relayerChains list.
    # It affects chains whose signer type is hexKey.
    usingDefaultSignerKey: true
    dbBootstrap:
      enabled: false
      bucket: ''
      object_targz: ''

  relayerChains:
    - name: 'ethereum'
      signer:
        type: # "aws"

  scraper:
    enabled: false
    # Optional Secret Manager secret containing {"websocketUrls": {"chain": "wss://..."}}.
    websocketConfigSecret: ''
    podAnnotations:
      prometheus.io/port: '9090'
      prometheus.io/scrape: 'true'
    podLabels: {}
    storage:
      size: 10Mi
      snapshot:
        enabled: false
        name: ''
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
    config:
      chainsToScrape: ''

  scraperProxy:
    diagnosticsDatabaseSecret: ''
    enabled: false
    maxAgentClients: 100
    port: 8383
    replicas: 1
    tunnel:
      enabled: true
      image: cloudflare/cloudflared:2026.8.2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  kathy:
    enabled: false

podSecurityContext:
  fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 250m
  #   memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
