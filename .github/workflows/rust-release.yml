name: Rust Agent Release

# Releases the agents on a manually pushed `agents-v<version>` tag, where the
# version is the Rust workspace version in rust/main/Cargo.toml (set by
# scripts/humanode-version.sh): builds the relayer, scraper and validator for
# Linux and macOS, and creates the GitHub release with the changelog since the
# previous release and the binaries attached. The agents image is built from the
# same tag by rust-docker.yml. A version with a prerelease suffix (1003.1.0-rc.1)
# becomes a pre-release.
#
# Upstream's workflow derived the next version from conventional commits on
# every push to main, opened a release PR through a GitHub App and created the
# tag when the PR merged. Our versions follow upstream's releases, so the tag is
# the release.

on:
  push:
    tags:
      - 'agents-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    name: Check the tag against the workspace version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          VERSION=$(rust/scripts/ci/get-workspace-version.sh)
          if [ "$GITHUB_REF_NAME" != "agents-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build ${{ matrix.TARGET }}
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
            OS: ubuntu-24.04
          - TARGET: x86_64-apple-darwin
            OS: macos-15
          - TARGET: aarch64-apple-darwin
            OS: macos-15
    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.TARGET }}
      - name: Build
        run: cargo build --release --target ${{ matrix.TARGET }} --bin relayer --bin scraper --bin validator
        working-directory: ./rust/main
      # One release holds every target's binaries, so each file name carries
      # its target.
      - name: Name the binaries by target
        run: |
          mkdir -p ../../../binaries
          for bin in relayer scraper validator; do
            chmod ug+x,-w "$bin"
            mv "$bin" "../../../binaries/$bin-${{ matrix.TARGET }}"
          done
        working-directory: rust/main/target/${{ matrix.TARGET }}/release
      - name: Upload the binaries
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.TARGET }}-${{ github.ref_name }}
          path: rust/main/binaries/*
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          path: binaries
          merge-multiple: true
      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Our version is upstream's with 1000 added to its first non-zero
          # component (scripts/humanode-version.sh).
          UPSTREAM=$(echo "$VERSION" | awk -F. -v OFS=. '{
            for (i = 1; i <= 3; i++) {
              if ($i > 0) {
                if ($i >= 1000) $i -= 1000
                break
              }
            }
            print
          }')
          {
            echo "Hyperlane agents $VERSION, built from upstream's $UPSTREAM."
            echo
            PREV_TAG=$(git tag -l 'agents-v*' --sort=-version:refname |
              grep -E '^agents-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
            if [ -n "$PREV_TAG" ]; then
              ./rust/scripts/ci/generate-workspace-changelog.sh "${PREV_TAG}..HEAD"
            else
              echo "The first agents release of this fork."
            fi
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
            TITLE="Agents $VERSION (Pre-release)"
          else
            FLAGS=""
            TITLE="Agents $VERSION"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            $FLAGS \
            binaries/*
