name: Build and Push Agent Image
on:
  push:
    branches: [main]
    paths:
      - 'rust/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/rust-docker.yml'
      - 'rust/main/Cargo.lock'
    tags:
      - 'agents-*'
  pull_request:
    paths:
      - 'rust/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/rust-docker.yml'
      - 'rust/main/Cargo.lock'
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Include arm64 in the build'
        required: false
        default: 'false'
concurrency:
  group: build-push-agents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate tag data
        id: taggen
        run: |
          set -euo pipefail
          echo "TAG_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "TAG_SHA=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -b 1-7)" >> $GITHUB_OUTPUT
          # For tag events, derive pure semver:
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${{ github.ref_name }}"
            # Strip agents- prefix and any leading v
            NAME="${NAME#agents-}"
            NAME="${NAME#v}"
            # Basic semver guard (allows prerelease/build metadata)
            if echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "SEMVER=$NAME" >> $GITHUB_OUTPUT
              # Check if this is a stable release (no prerelease suffix like -beta, -rc, -alpha)
              if echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "IS_STABLE=true" >> $GITHUB_OUTPUT
              else
                echo "IS_STABLE=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository_owner }}/hyperlane-agent
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ steps.taggen.outputs.SEMVER }},enable=${{ github.ref_type == 'tag' && steps.taggen.outputs.SEMVER != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.taggen.outputs.SEMVER }},enable=${{ github.ref_type == 'tag' && steps.taggen.outputs.IS_STABLE == 'true' }}
            type=raw,value=${{ steps.taggen.outputs.TAG_SHA }}-${{ steps.taggen.outputs.TAG_DATE }}
      - name: Set up QEMU
        if: github.event.inputs.include_arm64 == 'true'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      # The Dockerfile keeps the cargo registry, the cargo git checkouts and the
      # sccache directory in `RUN --mount=type=cache` mounts. Those live in the
      # builder, which is fresh on every runner, so their contents are saved and
      # restored around the build. A cache entry is immutable, so every run saves a
      # new one; the restore takes the newest entry with the closest match, as the
      # lockfile decides most of what is in there.
      - name: Cache the build cache mounts
        uses: actions/cache@v5
        with:
          path: cache-mount
          key: docker-agent-mounts-${{ hashFiles('rust/main/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            docker-agent-mounts-${{ hashFiles('rust/main/Cargo.lock') }}-
            docker-agent-mounts-
      # Injects the restored contents into the builder's cache mounts, and extracts
      # them back into `cache-mount` in its post step, before the cache is saved.
      # The map is explicit because the action's Dockerfile discovery takes the
      # mount id from the unexpanded `target=$SCCACHE_DIR`, while BuildKit uses the
      # expanded `/sccache`.
      - name: Inject the cache mounts into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cache-mount/cargo-registry": "/usr/local/cargo/registry",
              "cache-mount/cargo-git": "/usr/local/cargo/git",
              "cache-mount/sccache": "/sccache"
            }
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine platforms
        id: determine-platforms
        run: |
          if [ "${{ github.event.inputs.include_arm64 }}" == "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./rust/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ steps.determine-platforms.outputs.platforms }}
